# Publicacao do SAFE Hub no GitHub Pages.
#
# ⚠️ Substitui a publicacao "legacy" (build automatico da branch), que em
# 2026-08-06 passou a falhar com "Page build failed." e `duration: 0`, sem
# nenhum detalhe na API nem no painel. O ganho aqui nao e velocidade: e ter
# LOG. Quando falhar, da para ler o motivo em vez de adivinhar.
#
# O site e estatico e servido da raiz (.nojekyll), entao nao ha build: o job
# so empacota a raiz do repositorio e publica.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ `cancel-in-progress: true`, ao contrario do workflow padrao do GitHub.
# O motivo e concreto: em 2026-08-06 um run ficou preso no passo de publicar
# (ele comecou ANTES de a fonte do Pages virar `workflow`, entao tentava
# publicar num modo que ainda nao existia). Com `false`, todo push seguinte
# ficava na FILA atras do run morto, e nao havia como destravar sem direito de
# admin para cancelar na mao. Publicacao aqui e sempre a arvore inteira, entao
# a mais recente substituir a anterior e o comportamento certo de qualquer jeito.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Empacotar a raiz do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
