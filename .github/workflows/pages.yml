# Publicacao do SAFE Hub no GitHub Pages.
#
# ⚠️ Substitui a publicacao "legacy" (build automatico da branch), que em
# 2026-08-06 passou a falhar com "Page build failed." e `duration: 0`, sem
# nenhum detalhe na API nem no painel. O ganho aqui nao e velocidade: e ter
# LOG. Quando falhar, da para ler o motivo em vez de adivinhar.
#
# O site e estatico e servido da raiz (.nojekyll), entao nao ha build: o job
# so empacota a raiz do repositorio e publica.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ `cancel-in-progress: true`, ao contrario do workflow padrao do GitHub.
# O motivo e concreto: em 2026-08-06 um run ficou preso no passo de publicar
# (ele comecou ANTES de a fonte do Pages virar `workflow`, entao tentava
# publicar num modo que ainda nao existia). Com `false`, todo push seguinte
# ficava na FILA atras do run morto, e nao havia como destravar sem direito de
# admin para cancelar na mao. Publicacao aqui e sempre a arvore inteira, entao
# a mais recente substituir a anterior e o comportamento certo de qualquer jeito.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # ⚠️ Publica so o que o navegador precisa. Antes ia a arvore inteira, e
      # `graphify-out` sozinho sao 14 MB em 239 arquivos de artefato de
      # desenvolvimento, mais o codigo do backend (`apps-script`) e as
      # ferramentas de deploy (`tools`), nada disso servido a ninguem.
      #
      # Nao e so arrumacao: o passo de publicar estourava o tempo com o
      # deployment ainda `in_progress`, ou seja, a publicacao funcionava e era
      # lenta demais. Cortar quase metade dos arquivos ataca a causa.
      #
      # `preview/` FICA de proposito: e o preview de redesign, tem URL propria
      # e tirar quebraria os links que ja foram compartilhados.
      - name: Montar o site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'graphify-out' \
            --exclude 'apps-script' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            ./ _site/
          echo "arquivos publicados: $(find _site -type f | wc -l)"
          echo "peso: $(du -sh _site | cut -f1)"

      - name: Empacotar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          # O padrao e 10 min, e foi ele que abortou uma publicacao que estava
          # AVANCANDO (`deployment_in_progress`). Aborta-la deixava o run
          # marcado como falha mesmo com o site subindo, que e o pior dos
          # mundos: nao da para confiar nem no sucesso nem na falha.
          timeout: 1800000
