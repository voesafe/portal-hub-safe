# Publicacao do SAFE Hub no GitHub Pages.
#
# ⚠️ Substitui a publicacao "legacy" (build automatico da branch), que em
# 2026-08-06 passou a falhar com "Page build failed." e `duration: 0`, sem
# nenhum detalhe na API nem no painel. O ganho aqui nao e velocidade: e ter
# LOG. Quando falhar, da para ler o motivo em vez de adivinhar.
#
# O site e estatico e servido da raiz (.nojekyll), entao nao ha build: o job
# so empacota a raiz do repositorio e publica.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nao cancela uma publicacao em andamento: derrubar um deploy pela metade
# deixaria o site num estado que ninguem pediu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Empacotar a raiz do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
