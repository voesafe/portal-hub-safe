<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFE — Login</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260706">
  <meta name="application-name" content="SAFE">
  <meta name="apple-mobile-web-app-title" content="SAFE">
  <meta name="theme-color" content="#eef2f8">
  <link rel="icon" type="image/png" href="favicon.png?v=20260706">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260706">
  <link rel="stylesheet" href="css/safe-theme.css">
  <style>
    :root {
      --ink:        #1D2951;              /* navy — texto principal */
      --ink-soft:   rgba(29,41,81,.55);   /* texto secundário */
      --ink-faint:  rgba(29,41,81,.35);   /* texto terciário / ícones */
      --field-bg:   #f2f5fa;              /* fundo dos inputs */
      --field-brd:  rgba(29,41,81,.10);   /* borda dos inputs */
      --hairline:   rgba(29,41,81,.08);   /* divisórias */
    }

    body {
      background:
        radial-gradient(1100px 700px at 88% -10%, rgba(91,174,226,.14), transparent 60%),
        radial-gradient(900px 600px at -5% 110%, rgba(96,192,191,.14), transparent 55%),
        linear-gradient(165deg, #eef2f8 0%, #f7f9fc 45%, #eef4f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px;
    }

    /* Plano de fundo decorativo */
    .bg-decor { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .bg-circle { position: absolute; border-radius: 50%; opacity: .10; filter: blur(8px); }
    .bg-circle-1 { width: 620px; height: 620px; background: var(--blue); top: -220px; right: -170px; }
    .bg-circle-2 { width: 420px; height: 420px; background: var(--teal); bottom: -170px; left: -120px; }
    .bg-lines {
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 62px, rgba(29,41,81,.022) 62px, rgba(29,41,81,.022) 63px),
        repeating-linear-gradient(90deg, transparent, transparent 62px, rgba(29,41,81,.022) 62px, rgba(29,41,81,.022) 63px);
      mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    }

    /* Card */
    .login-card {
      position: relative; z-index: 1;
      background: #ffffff;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: clamp(30px, 5vh, 52px) clamp(24px, 5vw, 46px);
      width: 100%; max-width: 430px;
      box-shadow:
        0 1px 2px rgba(29,41,81,.04),
        0 20px 60px rgba(29,41,81,.12);
      animation: fadeUp .5s cubic-bezier(.4,0,.2,1);
    }
    /* Faixa de marca no topo do card */
    .login-card::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      background: linear-gradient(90deg, var(--blue), var(--teal));
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 30px;
    }
    .login-logo img {
      width: min(240px, 82%); height: auto;
    }

    .login-title {
      font-family: var(--font-title); font-size: 1.15rem;
      font-weight: 800; color: var(--ink); margin-bottom: 6px;
      text-align: center; letter-spacing: -.01em;
    }
    .login-sub {
      font-size: .82rem; color: var(--ink-soft);
      margin-bottom: 30px; text-align: center;
    }

    .login-label {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--ink-soft);
      margin-bottom: 7px; display: block;
    }

    /* Input wrapper com ícone */
    .input-wrap {
      position: relative; margin-bottom: 18px;
    }
    .input-wrap .input-icon {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      color: var(--ink-faint); display: flex; align-items: center;
      pointer-events: none; transition: color .2s;
    }
    .input-wrap .input-icon svg { width: 17px; height: 17px; }
    .input-wrap:focus-within .input-icon { color: var(--blue); }

    .login-input {
      width: 100%; padding: 13px 16px 13px 44px;
      background: var(--field-bg);
      border: 1.5px solid var(--field-brd);
      border-radius: var(--radius-sm);
      color: var(--ink); font-size: .95rem;
      font-family: var(--font-body); outline: none;
      transition: var(--transition);
    }
    .login-input:focus {
      border-color: var(--blue);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(91,174,226,.16);
    }
    .login-input::placeholder { color: var(--ink-faint); }

    /* Toggle senha */
    .input-wrap .toggle-senha {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--ink-faint); cursor: pointer; display: flex;
      align-items: center; padding: 5px;
      transition: color .2s;
    }
    .input-wrap .toggle-senha:hover { color: var(--blue); }
    .input-wrap .toggle-senha svg { width: 17px; height: 17px; }

    .login-input-senha { padding-right: 44px; }

    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      color: var(--white); border-radius: var(--radius-sm);
      font-family: var(--font-title); font-size: .96rem;
      font-weight: 700; letter-spacing: .03em;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 10px;
      box-shadow: 0 6px 18px rgba(91,174,226,.28);
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(91,174,226,.4);
    }
    .login-btn:active:not(:disabled) { transform: translateY(0); }
    .login-btn:disabled { opacity: .65; pointer-events: none; }
    .login-btn .spinner {
      width: 18px; height: 18px;
      border-width: 2px;
    }

    .login-error {
      background: rgba(231,76,60,.09);
      border: 1px solid rgba(231,76,60,.22);
      border-radius: var(--radius-sm);
      padding: 11px 14px; color: #c0392b;
      font-size: .82rem; margin-top: 16px;
      display: none; align-items: center; gap: 8px;
    }
    .login-error.show { display: flex; }
    .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

    .login-footer {
      margin-top: 30px; padding-top: 20px;
      border-top: 1px solid var(--hairline);
      text-align: center; font-size: .72rem;
      color: var(--ink-faint);
    }

    @media (max-width: 480px), (max-height: 720px) {
      body { align-items: flex-start; }
      .login-logo { margin-bottom: 24px; }
      .login-logo img { width: min(210px, 72%); }
      .login-footer { margin-top: 24px; padding-top: 16px; }
    }
  </style>
</head>
<body>

  <div class="bg-decor">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-lines"></div>
  </div>

  <div class="login-card">
    <div class="login-logo">
      <img src="assets/img/safe-logo-horizontal.png" alt="SAFE Escola de Aviação">
    </div>

    <div class="login-title">Acesso ao SAFE Hub</div>
    <div class="login-sub">Use seu e-mail corporativo e sua senha</div>

    <label class="login-label" for="inp-email">E-mail</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      </span>
      <input
        type="email"
        class="login-input"
        id="inp-email"
        placeholder="nome@voesafe.com.br"
        autocomplete="username"
      >
    </div>

    <label class="login-label" for="inp-senha">Senha</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <input
        type="password"
        class="login-input login-input-senha"
        id="inp-senha"
        placeholder="••••••••"
        autocomplete="current-password"
      >
      <button class="toggle-senha" id="toggle-senha" type="button" title="Mostrar/ocultar senha">
        <svg id="icon-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg id="icon-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>

    <button class="login-btn" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
      <span id="btn-login-label">Entrar no SAFE Hub</span>
    </button>

    <div class="login-error" id="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="login-error-msg"></span>
    </div>

    <div class="login-footer">
      SAFE Escola de Aviação &copy; 2026 &mdash; SAFE Hub
    </div>
  </div>

  <script src="js/config.js?v=20260706-rbac-effective-v1"></script>
  <script>
    // Redireciona se já estiver logado (localStorage persiste o login)
    const sessao = localStorage.getItem(CONFIG.SESSION_KEY)
                || sessionStorage.getItem(CONFIG.SESSION_KEY);
    if (sessao) {
      try {
        JSON.parse(sessao);
        let destino = 'inicio.html';
        try {
          const alvo = localStorage.getItem('safe_return_to');
          if (alvo) { destino = alvo; localStorage.removeItem('safe_return_to'); }
        } catch {}
        window.location.href = destino;
      } catch {
        localStorage.removeItem(CONFIG.SESSION_KEY);
        sessionStorage.removeItem(CONFIG.SESSION_KEY);
      }
    }
  </script>
  <script src="js/api.js?v=20260706-rbac-effective-v1"></script>
  <script src="js/auth.js?v=20260706-rbac-effective-v1"></script>
  <script>
    const btnLogin  = document.getElementById('btn-login');
    const btnLabel  = document.getElementById('btn-login-label');
    const inpEmail  = document.getElementById('inp-email');
    const inpSenha  = document.getElementById('inp-senha');
    const errEl     = document.getElementById('login-error');
    const errMsg    = document.getElementById('login-error-msg');
    const toggleBtn = document.getElementById('toggle-senha');

    // Toggle mostrar/ocultar senha
    toggleBtn.addEventListener('click', () => {
      const visible = inpSenha.type === 'text';
      inpSenha.type = visible ? 'password' : 'text';
      document.getElementById('icon-olho-aberto').style.display  = visible ? '' : 'none';
      document.getElementById('icon-olho-fechado').style.display = visible ? 'none' : '';
    });

    function mostrarErro(msg) {
      errMsg.textContent = msg;
      errEl.classList.add('show');
      inpEmail.style.borderColor = '';
      inpSenha.style.borderColor = '';
      // Shake no card
      const card = document.querySelector('.login-card');
      card.style.animation = 'none';
      requestAnimationFrame(() => { card.style.animation = 'shake .4s ease'; });
    }

    function limparErro() { errEl.classList.remove('show'); }

    function setLoading(on) {
      btnLogin.disabled = on;
      if (on) {
        btnLabel.textContent = 'Entrando...';
        btnLogin.insertAdjacentHTML('afterbegin', '<span class="spinner" style="margin-right:8px"></span>');
      } else {
        btnLabel.textContent = 'Entrar no SAFE Hub';
        const sp = btnLogin.querySelector('.spinner');
        if (sp) sp.remove();
      }
    }

    async function fazerLogin() {
      const email = inpEmail.value.trim();
      const senha = inpSenha.value;

      if (!email) { mostrarErro('Digite seu e-mail.'); inpEmail.focus(); return; }
      if (!inpEmail.validity.valid) { mostrarErro('Digite um e-mail válido.'); inpEmail.focus(); return; }
      if (!senha)  { mostrarErro('Digite sua senha.'); inpSenha.focus(); return; }

      limparErro();
      setLoading(true);

      const res = await Auth.login(email, senha);
      setLoading(false);

      if (res.ok) {
        window.location.href = Auth.paginaAposLogin();
      } else {
        mostrarErro(res.error || 'E-mail ou senha incorretos.');
        inpSenha.value = '';
        inpSenha.focus();
      }
    }

    btnLogin.addEventListener('click', fazerLogin);
    inpSenha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
    inpEmail.addEventListener('keydown', e => { if (e.key === 'Enter') inpSenha.focus(); });
    [inpEmail, inpSenha].forEach(el => el.addEventListener('input', limparErro));

    // Animação shake para erro
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-5px); }
        80%      { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
