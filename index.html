<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- tema:guarda-anti-flash -->
  <script>
    /* Carimba o modo escuro no <html> ANTES da primeira pintura.
       O Hub recarrega a pagina inteira a cada item da sidebar, entao sem
       isto quem usa escuro leva um clarao branco a cada navegacao.
       Precisa ser inline e sincrono no <head>: um arquivo externo chega
       tarde demais. Claro e o padrao e o sistema operacional nao opina,
       por decisao de produto, so entra no escuro quem pedir no menu. */
    (function () {
      try {
        var t = localStorage.getItem('safe-hub-theme');
        /* herda a preferencia de quem ja usava o escuro so dos NOTAMs */
        if (!t && localStorage.getItem('notams-theme') === 'dark') t = 'dark';
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <title>SAFE — Login</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260706">
  <meta name="application-name" content="SAFE">
  <meta name="apple-mobile-web-app-title" content="SAFE">
  <meta name="theme-color" content="#19213f">
  <link rel="icon" type="image/png" href="favicon.png?v=20260706">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260706">
  <link rel="stylesheet" href="css/core/safe-theme.css?v=20260727-contraste-v1">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px;
    }

    /* ---- Fundo (gradiente SAFE) ------------------------------------------
       Para trocar por uma imagem da SAFE depois, basta descomentar o
       background-image em .bg-layer e apontar para o arquivo desejado. */
    .bg-layer {
      position: fixed; inset: 0; z-index: -2;
      background:
        linear-gradient(135deg,
          #141d3a 0%,
          #1D2951 24%,
          #294080 50%,
          #3d8cc4 78%,
          #60C0BF 100%);
      /* background-image: url('assets/img/login-bg.jpg');
         background-size: cover; background-position: center; */
    }
    /* Camada opcional de escurecimento — garante contraste caso vire imagem */
    .bg-overlay {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 120% at 50% 20%, transparent 40%, rgba(10,15,40,.35) 100%);
    }
    /* Manchas de luz difusas para dar profundidade ao vidro */
    .bg-blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; z-index: -1; pointer-events: none; }
    .bg-blob-1 { width: 460px; height: 460px; background: var(--blue);  top: -120px; right: -80px; }
    .bg-blob-2 { width: 380px; height: 380px; background: var(--teal);  bottom: -140px; left: -100px; }

    /* ---- Card de vidro (glassmorphism) ----------------------------------- */
    .login-card {
      position: relative; z-index: 1;
      background:
        linear-gradient(160deg,
          rgba(255,255,255,.11) 0%,
          rgba(255,255,255,.05) 100%);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border-radius: 24px;
      padding: clamp(30px, 5vh, 48px) clamp(24px, 5vw, 42px);
      width: 100%; max-width: 420px;
      box-shadow:
        0 24px 60px rgba(10,15,40,.45),
        inset 0 1px 0 rgba(255,255,255,.22);
      animation: fadeUp .5s cubic-bezier(.4,0,.2,1);
    }
    /* Borda em gradiente de 1px (aresta de luz do vidro) — técnica de máscara */
    .login-card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      padding: 1px; pointer-events: none;
      background: linear-gradient(150deg,
        rgba(255,255,255,.55) 0%,
        rgba(255,255,255,.08) 35%,
        rgba(255,255,255,.04) 65%,
        rgba(255,255,255,.24) 100%);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      display: flex; justify-content: center;
      margin-bottom: 22px;
    }
    .login-logo img {
      width: 76px; height: 76px; border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 10px 28px rgba(0,0,0,.35);
    }

    .login-title {
      font-family: var(--font-title); font-size: 1.55rem;
      font-weight: 800; color: #fff; margin-bottom: 6px;
      text-align: center; letter-spacing: -.01em;
    }
    .login-sub {
      font-size: .88rem; color: rgba(255,255,255,.7);
      margin-bottom: 30px; text-align: center;
    }

    /* rótulos acessíveis, ocultos visualmente (estilo placeholder) */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Input wrapper com ícone */
    .input-wrap { position: relative; margin-bottom: 16px; }
    .input-wrap .input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,.6); display: flex; align-items: center;
      pointer-events: none; transition: color .2s;
    }
    .input-wrap .input-icon svg { width: 17px; height: 17px; }
    .input-wrap:focus-within .input-icon { color: #fff; }

    .login-input {
      width: 100%; padding: 14px 16px 14px 46px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      color: #fff; font-size: .95rem;
      font-family: var(--font-body); outline: none;
      transition: var(--transition);
    }
    .login-input:focus {
      border-color: rgba(255,255,255,.55);
      background: rgba(255,255,255,.16);
      box-shadow: 0 0 0 3px rgba(255,255,255,.14);
    }
    .login-input::placeholder { color: rgba(255,255,255,.55); }
    /* Preenchimento automático do navegador não quebra o visual de vidro */
    .login-input:-webkit-autofill,
    .login-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
      transition: background-color 9999s ease-out 0s;
      box-shadow: 0 0 0 1000px rgba(41,64,128,.55) inset;
    }

    /* Toggle senha */
    .input-wrap .toggle-senha {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,.6); cursor: pointer; display: flex;
      align-items: center; padding: 5px; transition: color .2s;
    }
    .input-wrap .toggle-senha:hover { color: #fff; }
    .input-wrap .toggle-senha svg { width: 17px; height: 17px; }
    .login-input-senha { padding-right: 46px; }

    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      color: #fff; border-radius: 12px;
      font-family: var(--font-title); font-size: .96rem;
      font-weight: 700; letter-spacing: .03em;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 12px;
      box-shadow: 0 8px 24px rgba(41,64,128,.4);
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(96,192,191,.45);
    }
    .login-btn:active:not(:disabled) { transform: translateY(0); }
    .login-btn:disabled { opacity: .65; pointer-events: none; }
    .login-btn .spinner { width: 18px; height: 18px; border-width: 2px; }

    .login-error {
      background: rgba(231,76,60,.18);
      border: 1px solid rgba(231,76,60,.4);
      border-radius: 12px;
      padding: 11px 14px; color: #ffdad4;
      font-size: .82rem; margin-top: 16px;
      display: none; align-items: center; gap: 8px;
    }
    .login-error.show { display: flex; }
    .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

    .login-footer {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.14);
      text-align: center; font-size: .72rem;
      color: rgba(255,255,255,.5);
    }

    @media (max-width: 480px), (max-height: 720px) {
      body { align-items: flex-start; }
      .login-logo { margin-bottom: 18px; }
      .login-logo img { width: 64px; height: 64px; }
      .login-title { font-size: 1.4rem; }
      .login-sub { margin-bottom: 24px; }
      .login-footer { margin-top: 22px; padding-top: 16px; }
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <div class="login-card">
    <div class="login-logo">
      <img src="assets/img/logo.png" alt="SAFE Escola de Aviação">
    </div>

    <div class="login-title">Bem-vindo ao SAFE Hub</div>
    <div class="login-sub">Entre com seu e-mail corporativo</div>

    <label class="sr-only" for="inp-email">E-mail</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      </span>
      <input
        type="email"
        class="login-input"
        id="inp-email"
        placeholder="nome@voesafe.com.br"
        autocomplete="username"
      >
    </div>

    <label class="sr-only" for="inp-senha">Senha</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <input
        type="password"
        class="login-input login-input-senha"
        id="inp-senha"
        placeholder="Senha"
        autocomplete="current-password"
      >
      <button class="toggle-senha" id="toggle-senha" type="button" title="Mostrar/ocultar senha">
        <svg id="icon-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg id="icon-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>

    <button class="login-btn" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
      <span id="btn-login-label">Entrar no SAFE Hub</span>
    </button>

    <div class="login-error" id="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="login-error-msg"></span>
    </div>

    <div class="login-footer">
      SAFE Escola de Aviação &copy; 2026 &mdash; SAFE Hub
    </div>
  </div>

  <script src="js/core/config.js?v=20260728-origens-ordem-alfabetica-v1"></script>
  <script>
    // Redireciona se já estiver logado (localStorage persiste o login)
    const sessao = localStorage.getItem(CONFIG.SESSION_KEY)
                || sessionStorage.getItem(CONFIG.SESSION_KEY);
    if (sessao) {
      try {
        JSON.parse(sessao);
        let destino = 'inicio.html';
        try {
          const alvo = localStorage.getItem('safe_return_to');
          if (alvo) { destino = alvo; localStorage.removeItem('safe_return_to'); }
        } catch {}
        window.location.href = destino;
      } catch {
        localStorage.removeItem(CONFIG.SESSION_KEY);
        sessionStorage.removeItem(CONFIG.SESSION_KEY);
      }
    }
  </script>
  <script src="js/core/api.js?v=20260728-avatar-recorte-v1"></script>
  <script src="js/core/auth.js?v=20260728-avatar-recorte-v1"></script>
  <script>
    const btnLogin  = document.getElementById('btn-login');
    const btnLabel  = document.getElementById('btn-login-label');
    const inpEmail  = document.getElementById('inp-email');
    const inpSenha  = document.getElementById('inp-senha');
    const errEl     = document.getElementById('login-error');
    const errMsg    = document.getElementById('login-error-msg');
    const toggleBtn = document.getElementById('toggle-senha');

    // Toggle mostrar/ocultar senha
    toggleBtn.addEventListener('click', () => {
      const visible = inpSenha.type === 'text';
      inpSenha.type = visible ? 'password' : 'text';
      document.getElementById('icon-olho-aberto').style.display  = visible ? '' : 'none';
      document.getElementById('icon-olho-fechado').style.display = visible ? 'none' : '';
    });

    function mostrarErro(msg) {
      errMsg.textContent = msg;
      errEl.classList.add('show');
      inpEmail.style.borderColor = '';
      inpSenha.style.borderColor = '';
      // Shake no card
      const card = document.querySelector('.login-card');
      card.style.animation = 'none';
      requestAnimationFrame(() => { card.style.animation = 'shake .4s ease'; });
    }

    function limparErro() { errEl.classList.remove('show'); }

    function setLoading(on) {
      btnLogin.disabled = on;
      if (on) {
        btnLabel.textContent = 'Entrando...';
        btnLogin.insertAdjacentHTML('afterbegin', '<span class="spinner" style="margin-right:8px"></span>');
      } else {
        btnLabel.textContent = 'Entrar no SAFE Hub';
        const sp = btnLogin.querySelector('.spinner');
        if (sp) sp.remove();
      }
    }

    async function fazerLogin() {
      const email = inpEmail.value.trim();
      const senha = inpSenha.value;

      if (!email) { mostrarErro('Digite seu e-mail.'); inpEmail.focus(); return; }
      if (!inpEmail.validity.valid) { mostrarErro('Digite um e-mail válido.'); inpEmail.focus(); return; }
      if (!senha)  { mostrarErro('Digite sua senha.'); inpSenha.focus(); return; }

      limparErro();
      setLoading(true);

      const res = await Auth.login(email, senha);
      setLoading(false);

      if (res.ok) {
        window.location.href = Auth.paginaAposLogin();
      } else {
        mostrarErro(res.error || 'E-mail ou senha incorretos.');
        inpSenha.value = '';
        inpSenha.focus();
      }
    }

    btnLogin.addEventListener('click', fazerLogin);
    inpSenha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
    inpEmail.addEventListener('keydown', e => { if (e.key === 'Enter') inpSenha.focus(); });
    [inpEmail, inpSenha].forEach(el => el.addEventListener('input', limparErro));

    // Animação shake para erro
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-5px); }
        80%      { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
