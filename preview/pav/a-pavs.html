<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAV · Cadastro (Operacional)</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>
  :root{--navy:#1D2951;--blue:#5BAEE2;--blue-d:#3d8cc4;--teal:#60C0BF;--teal-d:#3f9d9c;
    --bg:#F4F7FC;--card:#fff;--line:#E6ECF5;--line2:#DDE4EF;--ink:#1D2951;--muted:#7488a6;--muted2:#9aa9c2;
    --cpn:#3d8cc4;--cpn-bg:#eaf3fb;--sjk:#3f9d9c;--sjk-bg:#e7f5f4;--green:#2e9e6b;--green-bg:#e6f5ee;
    --h:'Raleway',sans-serif;--b:'Montserrat',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--b);background:var(--bg);color:var(--ink);min-height:100vh}
  a{text-decoration:none;color:inherit}
  .top{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:18px}
  .brand b{font-family:var(--h);font-weight:800;letter-spacing:.02em;font-size:15px}
  .brand span{font-size:11px;color:var(--muted2);display:block;margin-top:-2px}
  .tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:11px}
  .tab{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(29,41,81,.1)}
  .top-r{display:flex;align-items:center;gap:10px}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--card)}
  .user{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .wrap{padding:24px;max-width:1240px;margin:0 auto}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .head h1{font-family:var(--h);font-size:1.5rem;font-weight:800}
  .head .sub{font-size:.82rem;color:var(--muted);margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:.82rem;font-weight:600;border:1px solid var(--line2);background:var(--card);color:var(--navy);cursor:pointer}
  .btn:hover{border-color:var(--blue)}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .filters{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:11px;width:fit-content;margin-bottom:20px}
  .filters .f{padding:8px 18px;border-radius:8px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
  .filters .f.active{background:var(--navy);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
  .pav{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
  .pav::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--barcol,var(--cpn))}
  .pav:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(29,41,81,.1);border-color:var(--line2)}
  .pav-head{display:flex;align-items:center;gap:13px;margin-bottom:16px}
  .pav-av{width:48px;height:48px;border-radius:13px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--h);font-weight:800;font-size:1rem;flex-shrink:0}
  .pav-name{font-family:var(--h);font-weight:700;font-size:1.02rem}
  .badge{padding:3px 10px;border-radius:100px;font-size:.62rem;font-weight:700;text-transform:uppercase;display:inline-block;margin-top:3px}
  .badge.cpn{background:var(--cpn-bg);color:var(--cpn)}.badge.sjk{background:var(--sjk-bg);color:var(--sjk)}
  .pav-rows{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .prow{display:flex;align-items:center;gap:9px;font-size:.8rem;color:var(--ink)}
  .prow i{font-size:15px;color:var(--muted2);width:16px;text-align:center;flex-shrink:0}
  .pav-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--green);background:var(--green-bg);padding:5px 11px;border-radius:100px}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .pav-acts{display:flex;gap:6px}
  .act{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
  .act:hover{border-color:var(--blue);color:var(--blue-d)}
  .ribbon{position:fixed;bottom:14px;right:14px;z-index:99;display:flex;align-items:center;gap:8px;background:#141d3a;color:#fff;padding:7px 8px 7px 14px;border-radius:100px;box-shadow:0 10px 30px rgba(20,26,40,.4);font-size:12px;font-weight:600}
  .ribbon a{padding:5px 11px;border-radius:100px;font-weight:700;color:#9fb0cf}
  .ribbon a.on{background:#5BAEE2;color:#141d3a}
</style></head>
<body>
  <div class="top">
    <div class="brand"><div class="brand-ic"><i class="ti ti-plane-tilt"></i></div><div><b>Safe · PAV</b><span>Escala de base</span></div></div>
    <div class="tabs"><a class="tab" href="a-operacional.html"><i class="ti ti-calendar"></i> Calendário</a><a class="tab" href="a-financeiro.html"><i class="ti ti-cash"></i> Financeiro</a><a class="tab active" href="a-pavs.html"><i class="ti ti-users"></i> PAVs</a></div>
    <div class="top-r"><div class="icon-btn"><i class="ti ti-sun"></i></div><div class="user"><span>Victor</span><div class="avatar">V</div></div></div>
  </div>

  <div class="wrap">
    <div class="head">
      <div><h1>Cadastro de PAVs</h1><div class="sub">Equipe de pátio por base · dados e status</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn"><i class="ti ti-eye"></i> Ver inativos</button>
        <button class="btn primary"><i class="ti ti-plus"></i> Novo PAV</button>
      </div>
    </div>

    <div class="filters"><div class="f active">Todos</div><div class="f">CPN</div><div class="f">SJK</div></div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="ribbon">Operacional · <a href="a-operacional.html">Calendário</a><a href="a-financeiro.html">Financeiro</a><a class="on" href="a-pavs.html">PAVs</a></div>
<script>
var pavs=[
 ['Carlos Moraes','CM','CPN','123.456.789-00','(19) 99123-4567','carlos.m@voesafe.com.br'],
 ['André Lima','AL','CPN','234.567.890-11','(19) 99234-5678','andre.l@voesafe.com.br'],
 ['Bruno Dias','BD','CPN','345.678.901-22','(19) 99345-6789','bruno.d@voesafe.com.br'],
 ['Ana Prado','AP','SJK','456.789.012-33','(12) 99456-7890','ana.p@voesafe.com.br'],
 ['Marina Reis','MR','SJK','567.890.123-44','(12) 99567-8901','marina.r@voesafe.com.br'],
 ['Tiago Souza','TS','SJK','678.901.234-55','(12) 99678-9012','tiago.s@voesafe.com.br']
];
document.getElementById('grid').innerHTML=pavs.map(function(p){
 var col=p[2]==='CPN'?'var(--cpn)':'var(--sjk)';
 return '<div class="pav" style="--barcol:'+col+'">'+
  '<div class="pav-head"><span class="pav-av" style="background:'+col+'">'+p[1]+'</span>'+
   '<div><div class="pav-name">'+p[0]+'</div><span class="badge '+p[2].toLowerCase()+'">Base '+p[2]+'</span></div></div>'+
  '<div class="pav-rows">'+
   '<div class="prow"><i class="ti ti-id"></i>'+p[3]+'</div>'+
   '<div class="prow"><i class="ti ti-phone"></i>'+p[4]+'</div>'+
   '<div class="prow"><i class="ti ti-mail"></i>'+p[5]+'</div></div>'+
  '<div class="pav-foot"><span class="status"><span class="dot"></span> Ativo</span>'+
   '<div class="pav-acts"><div class="act"><i class="ti ti-edit"></i></div><div class="act"><i class="ti ti-power"></i></div></div></div>'+
  '</div>';
}).join('');
</script>
</body></html>
