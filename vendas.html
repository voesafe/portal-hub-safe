<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- tema:guarda-anti-flash -->
  <script>
    /* Carimba o modo escuro no <html> ANTES da primeira pintura.
       O Hub recarrega a pagina inteira a cada item da sidebar, entao sem
       isto quem usa escuro leva um clarao branco a cada navegacao.
       Precisa ser inline e sincrono no <head>: um arquivo externo chega
       tarde demais. Claro e o padrao e o sistema operacional nao opina,
       por decisao de produto, so entra no escuro quem pedir no menu. */
    (function () {
      try {
        var t = localStorage.getItem('safe-hub-theme');
        /* herda a preferencia de quem ja usava o escuro so dos NOTAMs */
        if (!t && localStorage.getItem('notams-theme') === 'dark') t = 'dark';
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <title>Vendas — SAFE Hub</title>
  <link rel="manifest" href="manifest.webmanifest?v=d836cf66">
  <meta name="theme-color" content="#19213f">
  <link rel="icon" type="image/png" href="favicon.png?v=91131805">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=4b0b2d7e">
  <link rel="stylesheet" href="css/core/safe-theme.css?v=9e14b94c">
  <link rel="stylesheet" href="css/core/layout.css?v=9d06c4a7">
  <link rel="stylesheet" href="css/pages/vendas.css?v=b03aba2b">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/img/logo.png?v=59c27084" alt="SAFE">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">SAFE</span>
        <span class="sidebar-brand-sub">Hub</span>
      </div>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user-current">
        <div class="sidebar-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Carregando...</div>
          <div class="sidebar-user-role">—</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-context">
          <div class="topbar-title">Vendas</div>
          <div class="topbar-subtitle" id="info-total">Carregando...</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-period">
          <select id="sel-mes">
            <option value="">Todos os meses</option>
            <option value="1">Janeiro</option><option value="2">Fevereiro</option>
            <option value="3">Março</option><option value="4">Abril</option>
            <option value="5">Maio</option><option value="6">Junho</option>
            <option value="7">Julho</option><option value="8">Agosto</option>
            <option value="9">Setembro</option><option value="10">Outubro</option>
            <option value="11">Novembro</option><option value="12">Dezembro</option>
          </select>
          <select id="sel-ano">
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btn-nova-venda" data-write-only>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova Venda
        </button>
        <button class="btn btn-ghost" id="btn-exportar-vendas" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Exportar CSV
        </button>
      </div>
    </div>

    <div class="page">
      <div class="card">
        <div class="card-header vendas-card-header">
          <div class="vendas-header-row">
            <div class="card-title">Registro de Vendas</div>
            <span id="badge-filtros-ativos" class="vendas-filter-count">0 filtros</span>
          </div>
          <div class="vendas-filter-panel" aria-label="Filtros de vendas">
            <div class="vendas-filter-field vendas-filter-search">
              <label for="busca">Busca</label>
              <input type="text" id="busca" class="form-control" placeholder="Nome, curso, email ou PAC">
            </div>
            <div class="vendas-filter-field" data-admin-only>
              <label for="filtro-pac-vendas">PAC</label>
              <select id="filtro-pac-vendas" class="form-control vendas-pac-filter">
                <option value="">Todos os PACs</option>
              </select>
            </div>
            <div class="vendas-filter-field">
              <label for="filtro-cidade-vendas">Cidade</label>
              <select id="filtro-cidade-vendas" class="form-control">
                <option value="">Todas as cidades</option>
              </select>
            </div>
            <div class="vendas-filter-field">
              <label for="filtro-estado-vendas">Estado</label>
              <select id="filtro-estado-vendas" class="form-control">
                <option value="">Todos os estados</option>
              </select>
            </div>
            <div class="vendas-filter-field">
              <label for="filtro-idade-vendas">Faixa etária</label>
              <select id="filtro-idade-vendas" class="form-control">
                <option value="">Todas as idades</option>
                <option value="menor18">Menor de 18</option>
                <option value="18-24">18 - 24 anos</option>
                <option value="25-34">25 - 34 anos</option>
                <option value="35-44">35 - 44 anos</option>
                <option value="45-54">45 - 54 anos</option>
                <option value="55+">55+ anos</option>
              </select>
            </div>
            <button class="btn btn-ghost btn-sm vendas-clear-filters" id="btn-limpar-filtros" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Limpar
            </button>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="table table-vendas">
            <thead>
              <tr>
                <th>Data</th>
                <th id="col-pac-header" class="col-pac">PAC</th>
                <th>Cliente</th>
                <th class="col-curso">Curso</th>
                <th class="col-origem">Origem</th>
                <th class="col-lead">Lead Novo</th>
                <th class="col-valor" style="text-align:right">Valor</th>
                <th style="width:48px"></th>
              </tr>
            </thead>
            <tbody id="tabela-vendas"></tbody>
          </table>
        </div>
      </div>

      <div class="dashboard-loading-overlay active" id="vendas-loading">
        <div class="dashboard-loading-card">
          <img class="dashboard-loading-logo" src="assets/img/logo.png?v=59c27084" alt="">
          <span class="dashboard-loading-text" id="vendas-loading-text">Carregando vendas...</span>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── Modal Venda ────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-venda">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3 id="modal-titulo" style="font-size:1.05rem">Nova Venda</h3>
      <button class="modal-close" id="modal-close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">

      <!-- Seção: Dados da Venda -->
      <div class="modal-section-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3v18l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V3l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Dados da Venda
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Data da Venda *</label>
          <input type="date" class="form-control" id="f-data">
        </div>
        <div class="form-group">
          <label class="form-label">Consultor (PAC) *</label>
          <select class="form-control" id="f-pac">
            <option value="Thiago">Thiago</option>
            <option value="Marlon">Marlon</option>
            <option value="Adauto">Adauto</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Curso / Produto Comprado *</label>
        <input type="hidden" id="f-curso">
        <div class="curso-picker" id="curso-picker">
          <button class="form-control curso-picker-trigger" id="curso-picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="curso-picker-placeholder">Selecione um ou mais cursos</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="curso-picker-panel" id="curso-picker-panel">
            <input type="text" class="form-control curso-picker-search" id="curso-picker-search" placeholder="Buscar curso">
            <div class="curso-picker-options" id="curso-picker-options" role="listbox" aria-multiselectable="true"></div>
            <div class="curso-picker-footer">
              <span id="curso-picker-count">0 selecionados</span>
              <button class="curso-picker-clear" id="curso-picker-clear" type="button">Limpar</button>
            </div>
          </div>
        </div>
        <div class="curso-picker-selected" id="curso-picker-selected"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Valor da Compra (R$) *</label>
          <input type="text" inputmode="numeric" class="form-control" id="f-valor" placeholder="0,00">
        </div>
        <div class="form-group">
          <label class="form-label">Origem do Lead *</label>
          <select class="form-control" id="f-origem">
            <option value="">Selecione</option>
            <!-- em ordem alfabetica, com "Outros" sempre por ultimo -->
            <option>Aluno Interno</option><option>Facebook</option>
            <option>Google</option><option>Indicação</option>
            <option>Instagram</option><option>Plataforma Teórico</option>
            <option>Site</option><option>WhatsApp</option>
            <option>YouTube</option><option>Outros</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Lead Novo? *</label>
          <select class="form-control" id="f-lead-novo">
            <option value="">Selecione</option>
            <option value="Não">Não</option>
            <option value="Sim">Sim</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Quem Comprou *</label>
          <select class="form-control" id="f-quem-comprou">
            <option value="">Selecione</option>
            <option value="Aluno">Aluno</option>
            <option value="Pai">Pai</option>
            <option value="Mãe">Mãe</option>
            <option value="Pai e Mãe">Pai e Mãe</option>
            <option value="Responsável">Responsável</option>
          </select>
        </div>
      </div>

      <!-- Seção: Dados do Cliente -->
      <div class="modal-section-title" style="margin-top:8px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Dados do Cliente
      </div>

      <div class="form-group">
        <label class="form-label">Nome Completo *</label>
        <input type="text" class="form-control" id="f-nome" placeholder="Nome completo do cliente">
      </div>

      <!-- inputmode numeric abre o teclado de numeros no celular; maxlength 14
           = 11 digitos + os 3 separadores da mascara. -->
      <div class="form-group">
        <label class="form-label">CPF *</label>
        <input type="text" class="form-control" id="f-cpf" placeholder="000.000.000-00"
               inputmode="numeric" autocomplete="off" maxlength="14">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Sexo *</label>
          <select class="form-control" id="f-sexo">
            <option value="">Selecione</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Data de Nascimento *</label>
          <input type="date" class="form-control" id="f-nascimento">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">E-mail *</label>
        <input type="email" class="form-control" id="f-email" placeholder="email@exemplo.com">
      </div>

      <!-- Estado vem ANTES da cidade porque a lista de cidades depende dele:
           o campo Cidade fica desabilitado ate haver um estado escolhido. -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Estado *</label>
          <select class="form-control" id="f-estado">
            <option value="">Selecione</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
            <option>SP</option><option>SE</option><option>TO</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Cidade *</label>
          <select class="form-control" id="f-cidade" disabled>
            <option value="">Escolha o estado primeiro</option>
          </select>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancelar">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar">Salvar Venda</button>
    </div>
  </div>
</div>

<!-- ── Modal: campos que faltam ──────────────────────────────
     Fica DEPOIS do modal-venda no HTML de proposito: os dois sao
     .modal-overlay com o mesmo z-index, entao quem vem por ultimo e que
     aparece por cima. -->
<div class="modal-overlay" id="modal-campos-faltando" role="alertdialog" aria-modal="true" aria-labelledby="faltando-titulo">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h3 id="faltando-titulo" style="font-size:1.05rem">Faltam campos para salvar</h3>
      <button class="modal-close" id="faltando-close" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p class="faltando-intro" id="faltando-intro">Preencha os campos abaixo para registrar a venda:</p>
      <ul class="faltando-lista" id="faltando-lista"></ul>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="faltando-ok">Voltar e preencher</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/core/config.js?v=cac00e61"></script>
<script src="js/core/api.js?v=43d13a41"></script>
<script src="js/core/auth.js?v=47cb2ebd"></script>
<script src="js/data/municipios-br.js?v=d876cc49"></script>
<script src="js/pages/vendas.js?v=a25d3046"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      if (!Auth.eAdmin()) document.getElementById('col-pac-header')?.remove();
    }, 100);
  });
</script>
</body>
</html>
