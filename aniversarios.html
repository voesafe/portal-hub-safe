<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- tema:guarda-anti-flash -->
  <script>
    /* Carimba o modo escuro no <html> ANTES da primeira pintura.
       O Hub recarrega a pagina inteira a cada item da sidebar, entao sem
       isto quem usa escuro leva um clarao branco a cada navegacao.
       Precisa ser inline e sincrono no <head>: um arquivo externo chega
       tarde demais. Claro e o padrao e o sistema operacional nao opina,
       por decisao de produto, so entra no escuro quem pedir no menu. */
    (function () {
      try {
        var t = localStorage.getItem('safe-hub-theme');
        /* herda a preferencia de quem ja usava o escuro so dos NOTAMs */
        if (!t && localStorage.getItem('notams-theme') === 'dark') t = 'dark';
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <title>Aniversários — SAFE Hub</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260706">
  <meta name="theme-color" content="#19213f">
  <link rel="icon" type="image/png" href="favicon.png?v=20260706">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260706">
  <link rel="stylesheet" href="css/core/safe-theme.css?v=20260727-contraste-v1">
  <link rel="stylesheet" href="css/core/layout.css?v=20260728-avatar-recorte-v1">
  <link rel="stylesheet" href="css/pages/aniversarios.css?v=20260727-contraste-v1">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/img/logo.png" alt="SAFE">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">SAFE</span>
        <span class="sidebar-brand-sub">Hub</span>
      </div>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user-current">
        <div class="sidebar-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Carregando...</div>
          <div class="sidebar-user-role">—</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-context">
          <div class="topbar-title">Aniversários</div>
          <div class="topbar-subtitle">E-mail de parabéns automático para alunos ativos</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-status" id="aniv-pill" hidden>
          <span class="topbar-status-dot" aria-hidden="true"></span>
          <span class="aniv-pill-label">—</span>
        </span>
        <button class="btn btn-ghost" id="btn-recarregar-aniv" type="button">Atualizar</button>
      </div>
    </div>

    <div class="page aniversarios-page">

      <!-- Indicadores -->
      <section class="aniv-kpis" id="aniv-kpis"></section>

      <!-- Hoje -->
      <section class="card aniv-bloco">
        <header class="aniv-bloco-head">
          <div>
            <h2 class="aniv-bloco-titulo">Hoje</h2>
            <p class="aniv-bloco-sub" id="aniv-hoje-sub">—</p>
          </div>
        </header>
        <div id="aniv-hoje-lista" class="aniv-lista"></div>
      </section>

      <!-- Próximos 7 dias -->
      <section class="card aniv-bloco">
        <header class="aniv-bloco-head">
          <div>
            <h2 class="aniv-bloco-titulo">Próximos 7 dias</h2>
            <p class="aniv-bloco-sub">Para quem quiser fazer algo além do e-mail</p>
          </div>
        </header>
        <div id="aniv-proximos-lista" class="aniv-lista"></div>
      </section>

      <!-- Mês -->
      <section class="card aniv-bloco">
        <header class="aniv-bloco-head">
          <div>
            <h2 class="aniv-bloco-titulo">Aniversariantes do mês</h2>
            <p class="aniv-bloco-sub" id="aniv-mes-sub">—</p>
          </div>
          <select class="form-control aniv-select-mes" id="aniv-mes">
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </header>
        <div class="table-wrapper">
          <table class="table table-aniversarios">
            <thead>
              <tr>
                <th>Dia</th>
                <th>Aluno</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>E-mail</th>
                <th>Situação</th>
              </tr>
            </thead>
            <tbody id="aniv-mes-corpo"></tbody>
          </table>
        </div>
      </section>

      <div class="dashboard-loading-overlay" id="aniv-loading">
        <div class="dashboard-loading-card">
          <img class="dashboard-loading-logo" src="assets/img/logo.png" alt="">
          <span class="dashboard-loading-text" id="aniv-loading-text">Carregando aniversários...</span>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/core/config.js?v=20260728-origens-ordem-alfabetica-v1"></script>
<script src="js/core/api.js?v=20260728-avatar-recorte-v1"></script>
<script src="js/core/auth.js?v=20260728-notams-v1"></script>
<script src="js/pages/aniversarios.js?v=20260727-tema-global-v1"></script>
</body>
</html>
