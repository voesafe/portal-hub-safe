<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#19213f">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/safe-theme.css">
<link rel="stylesheet" href="css/layout.css?v=20260606-minions">
<title>SAFE MINIONS — SAFE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --azul: #1D2951;
    --azul-claro: #5BAEE2;
    --verde: #22c55e;
    --vermelho: #ef4444;
    --amarelo: #f59e0b;
    --cinza-bg: #f0f4f8;
    --cinza-borda: #dde3ec;
    --texto: #1a2035;
    --texto-leve: #6b7a99;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .safe-minions-page {
    font-family: 'Syne', sans-serif;
    color: var(--texto);
  }

  /* HEADER */
  header {
    background: var(--azul);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 3px solid var(--azul-claro);
  }
  header .logo-text {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 2px;
  }
  header .logo-sub {
    font-size: 11px;
    color: var(--azul-claro);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }
  header .divider { width: 1px; height: 40px; background: rgba(255,255,255,0.2); margin: 0 8px; }
  header .header-title {
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  /* MAIN */
  .safe-minions-content { max-width: 960px; margin: 0 auto; }

  /* UPLOAD AREA */
  .upload-section {
    display: block;
    width: 100%;
    background: #fff;
    border: 2px dashed var(--cinza-borda);
    border-radius: 8px;
    padding: 60px 40px;
    text-align: center;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    position: relative;
  }
  .upload-section:hover, .upload-section.drag-over {
    border-color: var(--azul-claro);
    background: #f5faff;
  }
  .upload-section input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-icon {
    font-size: 48px; margin-bottom: 16px; display: block;
  }
  .upload-section h2 {
    font-size: 20px; font-weight: 700; color: var(--azul); margin-bottom: 8px;
  }
  .upload-section p {
    font-size: 14px; color: var(--texto-leve); font-family: 'DM Mono', monospace;
  }

  /* TIPO SELECTOR */
  .tipo-selector {
    display: flex; gap: 12px; margin-bottom: 32px;
  }
  .tipo-btn {
    flex: 1; padding: 16px; border: 2px solid var(--cinza-borda);
    border-radius: 12px; background: #fff; cursor: pointer;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px;
    color: var(--texto-leve); transition: all 0.2s; text-align: center;
  }
  .tipo-btn:hover { border-color: var(--azul-claro); color: var(--azul); }
  .tipo-btn.ativo {
    border-color: var(--azul); background: var(--azul); color: #fff;
  }
  .tipo-btn .tipo-label { font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 400; display: block; margin-top: 4px; opacity: 0.7; }

  /* RESULTADO */
  #resultado { display: none; }

  .resultado-header {
    background: var(--azul);
    border-radius: 8px 8px 0 0;
    padding: 28px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .resultado-header h2 { color: #fff; font-size: 18px; font-weight: 700; }
  .resultado-header .tipo-badge {
    background: var(--azul-claro); color: #fff;
    padding: 6px 16px; border-radius: 20px;
    font-size: 12px; font-family: 'DM Mono', monospace; letter-spacing: 1px;
  }

  .resultado-body {
    background: #fff;
    border-radius: 0 0 8px 8px;
    border: 1px solid var(--cinza-borda);
    border-top: none;
    overflow: hidden;
  }

  /* RESUMO GERAL */
  .resumo-geral {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--cinza-borda);
  }
  .resumo-item {
    padding: 20px 24px; border-right: 1px solid var(--cinza-borda);
    text-align: center;
  }
  .resumo-item:last-child { border-right: none; }
  .resumo-item .val {
    font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500;
    color: var(--azul); display: block; margin-bottom: 4px;
  }
  .resumo-item .label {
    font-size: 11px; color: var(--texto-leve); text-transform: uppercase; letter-spacing: 1px;
  }

  /* STATUS GERAL */
  .status-geral {
    padding: 16px 32px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--cinza-borda);
    font-weight: 700; font-size: 15px;
  }
  .status-geral.aprovado { background: #f0fdf4; color: #166534; }
  .status-geral.reprovado { background: #fef2f2; color: #991b1b; }
  .status-geral .status-icon { font-size: 20px; }

  /* GRID DE MÍNIMOS */
  .minimos-grid {
    padding: 24px 32px;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .minimo-card {
    border: 1.5px solid var(--cinza-borda);
    border-radius: 12px;
    padding: 16px 20px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s;
  }
  .minimo-card:hover { transform: translateY(-1px); }
  .minimo-card.ok { border-color: #bbf7d0; background: #f0fdf4; }
  .minimo-card.erro { border-color: #fecaca; background: #fef2f2; }
  .minimo-card.aviso { border-color: #fde68a; background: #fffbeb; }

  .minimo-card .mc-header {
    display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px;
  }
  .minimo-card .mc-nome {
    font-size: 13px; font-weight: 700; color: var(--azul); line-height: 1.3;
    max-width: 75%;
  }
  .minimo-card .mc-badge {
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 6px; white-space: nowrap;
  }
  .ok .mc-badge { background: #dcfce7; color: #166534; }
  .erro .mc-badge { background: #fee2e2; color: #991b1b; }
  .aviso .mc-badge { background: #fef3c7; color: #92400e; }

  .minimo-card .mc-valores {
    display: flex; align-items: baseline; gap: 8px;
  }
  .minimo-card .mc-atual {
    font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500;
  }
  .ok .mc-atual { color: #16a34a; }
  .erro .mc-atual { color: #dc2626; }
  .aviso .mc-atual { color: #d97706; }

  .minimo-card .mc-minimo {
    font-size: 12px; color: var(--texto-leve); font-family: 'DM Mono', monospace;
  }
  .minimo-card .mc-deficit {
    font-size: 12px; font-family: 'DM Mono', monospace; margin-top: 4px;
    color: #dc2626; font-weight: 500;
  }

  /* BARRA DE PROGRESSO */
  .mc-barra-wrap { margin-top: 10px; background: rgba(0,0,0,0.06); border-radius: 4px; height: 5px; overflow: hidden; }
  .mc-barra { height: 5px; border-radius: 4px; transition: width 0.6s ease; }
  .ok .mc-barra { background: #16a34a; }
  .erro .mc-barra { background: #dc2626; }
  .aviso .mc-barra { background: #d97706; }

  /* CARD ESPECIAL — NAV */
  .minimo-card.full { grid-column: 1 / -1; }

  .nav-detail {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(0,0,0,0.07);
    font-size: 12px; font-family: 'DM Mono', monospace; color: var(--texto-leve);
    line-height: 1.7;
  }
  .nav-detail .nav-ok { color: #16a34a; }
  .nav-detail .nav-erro { color: #dc2626; }

  /* TABELA REGISTROS */
  .registros-section {
    padding: 0 32px 32px;
  }
  .registros-toggle {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 12px 0; border-top: 1px solid var(--cinza-borda);
    font-size: 13px; font-weight: 700; color: var(--texto-leve);
    user-select: none;
  }
  .registros-toggle:hover { color: var(--azul); }
  .registros-toggle .toggle-icon { transition: transform 0.2s; }
  .registros-toggle.aberto .toggle-icon { transform: rotate(180deg); }

  .registros-tabela-wrap { display: none; overflow-x: auto; margin-top: 12px; }
  .registros-tabela-wrap.aberto { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: 'DM Mono', monospace; }
  thead tr { background: var(--azul); color: #fff; }
  thead th { padding: 10px 12px; text-align: left; font-weight: 500; letter-spacing: 0.5px; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #f8fafc; }
  tbody tr:hover { background: #eef4fb; }
  tbody td { padding: 8px 12px; color: var(--texto); border-bottom: 1px solid var(--cinza-borda); white-space: nowrap; }
  tbody td.excluido { opacity: 0.4; text-decoration: line-through; }

  /* NOVA ANÁLISE */
  .nova-analise-btn {
    display: block; margin: 32px auto 0;
    background: var(--azul); color: #fff;
    border: none; border-radius: 10px; padding: 14px 40px;
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px; transition: background 0.2s;
  }
  .nova-analise-btn:hover { background: var(--azul-claro); }

  /* LOADING */
  .loading {
    display: none; text-align: center; padding: 40px;
  }
  .loading.ativo { display: block; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--cinza-borda);
    border-top-color: var(--azul-claro); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--texto-leve); font-family: 'DM Mono', monospace;
    margin-bottom: 12px; display: block;
  }

  /* EASTER EGG MINION */
  .easter-egg {
    position: fixed;
    bottom: -40px;
    right: 20px;
    width: 80px;
    height: auto;
    cursor: pointer;
    transition: bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s;
    z-index: 9999;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
    opacity: 0.85;
  }
  .easter-egg:hover {
    bottom: 0px;
    transform: rotate(-8deg) scale(1.1);
    opacity: 1;
  }

  @media (max-width: 600px) {
    .resumo-geral { grid-template-columns: repeat(2,1fr); }
    .minimos-grid { grid-template-columns: 1fr; }
    .minimo-card.full { grid-column: 1; }
    header { padding: 16px 20px; }
    .easter-egg { width: 50px; right: 10px; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/img/logo.png" alt="SAFE">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">SAFE</span>
        <span class="sidebar-brand-sub">Comercial</span>
      </div>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user-current">
        <div class="sidebar-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Carregando...</div>
          <div class="sidebar-user-role">—</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div>
          <div class="topbar-title">SAFE MINIONS</div>
          <div class="topbar-subtitle">Verificação de mínimos ANAC · IS 141-007</div>
        </div>
      </div>
    </div>

    <div class="page safe-minions-page">
      <div class="safe-minions-content">
        <div id="upload-section">
          <span class="section-label">Tipo de habilitação</span>
          <div class="tipo-selector" role="group" aria-label="Tipo de habilitação">
            <button class="tipo-btn ativo" type="button" data-tipo="ppa" onclick="selecionarTipo('ppa')">
              PPA
              <span class="tipo-label">Piloto Privado de Avião</span>
            </button>
            <button class="tipo-btn" type="button" data-tipo="pc" onclick="selecionarTipo('pc')">
              PC / IFR
              <span class="tipo-label">Piloto Comercial + Instrumentos</span>
            </button>
          </div>

          <label class="upload-section" id="drop-area">
            <input type="file" id="file-input" accept=".xlt,.xltx,.xlsx,.xls">
            <span class="upload-icon" aria-hidden="true">↥</span>
            <h2>Arraste o arquivo SACI aqui</h2>
            <p>ou clique para selecionar · .xlt · .xltx · .xlsx · .xls</p>
          </label>
        </div>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p style="color:var(--texto-leve);font-family:'DM Mono',monospace;font-size:13px;">Processando extrato SACI...</p>
        </div>

        <div id="resultado"></div>
      </div>
    </div>
  </main>
</div>

<img src="assets/safe-minions/minion.png" alt="" class="easter-egg" id="minion-banana" title="Banana" role="button" tabindex="0">
<audio id="banana-audio" src="assets/safe-minions/banana.m4a" preload="none"></audio>

<script src="js/config.js"></script>

<script src="assets/safe-minions/xlsx.full.min.js"></script>
<script>
const acessoMaster = Auth.protegerMaster();
if (!acessoMaster) {
  document.documentElement.hidden = true;
} else {
  Auth.preencherUI();
}

const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');
document.getElementById('hamburger')?.addEventListener('click', () => {
  sidebar?.classList.add('mobile-open');
  sidebarOverlay?.classList.add('active');
});
sidebarOverlay?.addEventListener('click', () => {
  sidebar?.classList.remove('mobile-open');
  sidebarOverlay.classList.remove('active');
});

// ─── ESTADO ───────────────────────────────────────────────────
let tipoAtual = 'ppa';

function selecionarTipo(tipo) {
  tipoAtual = tipo;
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('ativo'));
  document.querySelector(`[data-tipo="${tipo}"]`).classList.add('ativo');
}

// ─── DRAG & DROP ──────────────────────────────────────────────
const dropArea = document.getElementById('drop-area');
const fileInput = document.getElementById('file-input');

dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('drag-over'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('drag-over'));
dropArea.addEventListener('drop', e => {
  e.preventDefault(); dropArea.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) processarArquivo(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) processarArquivo(e.target.files[0]); });

// ─── PROCESSAMENTO ────────────────────────────────────────────
function processarArquivo(file) {
  document.getElementById('upload-section').style.display = 'none';
  document.getElementById('loading').classList.add('ativo');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      let rows = [];
      const nome = file.name.toLowerCase();

      if (nome.endsWith('.xlt') && !nome.endsWith('.xltx')) {
        // HTML disfarçado (formato SACI antigo)
        rows = parseXLTHtml(e.target.result);
      } else {
        // Excel real (.xltx / .xlsx)
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: false });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
        rows = data.slice(1)
          .filter(r => r[0] && !String(r[0]).includes('TOTAL') && r.some(c => c != null))
          .map(r => ({
            data: formatarData(r[0]),
            matricula: String(r[1] || '').trim(),
            habilitacao: String(r[2] || '').trim(),
            modelo: String(r[3] || '').trim(),
            participante: String(r[4] || '').trim(),
            pousos: parseInt(r[5]) || 0,
            origem: String(r[6] || '').trim(),
            destino: String(r[7] || '').trim(),
            observacao: String(r[8] || '').trim(),
            funcao: normalizarFuncao(String(r[9] || '').trim()),
            diurno: parseTime(r[10]),
            noturno: parseTime(r[11]),
            naveg: parseTime(r[12]),
            inst: parseTime(r[13]),
            capota: parseTime(r[14]),
            simulador: parseTime(r[15]),
            milhas: parseFloat(String(r[16] || '0').replace(',', '.')) || 0,
            status: String(r[19] || '').trim().toUpperCase()
          }));
      }

      document.getElementById('loading').classList.remove('ativo');

      const ativos = rows.filter(r => r.status !== 'EXCLUSÃO SOLICITADA' && r.status !== 'EXCLUSAO SOLICITADA');
      const resultado = tipoAtual === 'ppa' ? analisarPPA(ativos) : analisarPC(ativos);
      renderizarResultado(resultado, ativos, rows);

    } catch(err) {
      document.getElementById('loading').classList.remove('ativo');
      document.getElementById('upload-section').style.display = 'block';
      alert('Erro ao ler o arquivo: ' + err.message);
      console.error(err);
    }
  };

  if (file.name.toLowerCase().endsWith('.xlt') && !file.name.toLowerCase().endsWith('.xltx')) {
    reader.readAsText(file, 'ISO-8859-1');
  } else {
    reader.readAsArrayBuffer(file);
  }
}

// ─── PARSER XLT (HTML) ────────────────────────────────────────
function parseXLTHtml(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const rows = doc.querySelectorAll('tr');
  const result = [];
  let isFirst = true;
  rows.forEach(tr => {
    if (isFirst) { isFirst = false; return; }
    const cells = tr.querySelectorAll('td');
    if (cells.length < 20) return;
    const get = i => cells[i] ? cells[i].textContent.trim() : '';
    result.push({
      data: get(0), matricula: get(1), habilitacao: get(2), modelo: get(3),
      participante: get(4), pousos: parseInt(get(5)) || 0,
      origem: get(6), destino: get(7), observacao: get(8),
      funcao: normalizarFuncao(get(9)),
      diurno: parseTime(get(10)), noturno: parseTime(get(11)),
      naveg: parseTime(get(12)), inst: parseTime(get(13)),
      capota: parseTime(get(14)), simulador: parseTime(get(15)),
      milhas: parseFloat(get(16).replace(',', '.')) || 0,
      status: get(19).toUpperCase()
    });
  });
  return result.filter(r => r.data && !r.data.includes('TOTAL'));
}

// ─── HELPERS ──────────────────────────────────────────────────
function formatarData(val) {
  if (!val) return '';
  // Serial numérico do Excel (dias desde 1900-01-01)
  if (typeof val === 'number') {
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    const dd = String(d.getUTCDate()).padStart(2,'0');
    const mm = String(d.getUTCMonth()+1).padStart(2,'0');
    const yyyy = d.getUTCFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }
  return String(val).trim();
}

function normalizarFuncao(f) {
  // Remove todos os caracteres não-ASCII e normaliza para comparação
  // Necessário pois o SACI exporta com encoding corrompido (ex: "Instru鈬o" = "Instrução")
  const fl = f.toLowerCase().replace(/[^\x00-\x7F]/g, '_');
  if (/instru.{0,5}o\s+solo/i.test(fl) || fl.includes('solo')) return 'PI_SOLO';
  if (/instru/i.test(fl)) return 'PI';
  if (/comando/i.test(fl)) return 'PIC';
  if (/co.?piloto|copiloto/i.test(fl)) return 'COPILOTO';
  return f;
}

function parseTime(val) {
  if (!val) return 0;
  const s = String(val).trim();
  if (!s || s === '0' || s === '00:00') return 0;
  // HH:MM
  const m1 = s.match(/^(\d+):(\d{2})$/);
  if (m1) return parseInt(m1[1]) * 60 + parseInt(m1[2]);
  // HH:MM:SS
  const m2 = s.match(/^(\d+):(\d{2}):(\d{2})$/);
  if (m2) return parseInt(m2[1]) * 60 + parseInt(m2[2]);
  // Fração de dia Excel (0.0208... = 30min)
  const n = parseFloat(s);
  if (!isNaN(n) && n > 0 && n < 5) return Math.round(n * 24 * 60);
  return 0;
}

function fmt(min) {
  if (min < 0) min = 0;
  return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
}

function fmtH(min) {
  return `${(min/60).toFixed(1)}h`;
}

function sum(arr, fn) { return arr.reduce((a, r) => a + fn(r), 0); }

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}

// ─── ANÁLISE PPA ──────────────────────────────────────────────
function analisarPPA(rows) {
  const dc   = rows.filter(r => r.funcao === 'PI');
  const solo = rows.filter(r => r.funcao === 'PI_SOLO');

  const totalGeral  = sum(rows, r => r.diurno + r.noturno);
  const totalDC     = sum(dc,   r => r.diurno + r.noturno);
  const dcNoturno   = sum(dc,   r => r.noturno);
  const totalSolo   = sum(solo, r => r.diurno + r.noturno);
  const navSolo     = sum(solo, r => r.naveg);
  const fstd        = sum(rows, r => r.simulador);
  const fstdCred    = Math.min(fstd, 300); // até 5h

  // Nav 150nm: qualquer função (DC ou solo), trechos do mesmo dia somados, 2 aeródromos além da partida
  const nav150 = verificarNav150(rows);

  const minimos = [
    { nome: 'Total de horas do curso', atual: totalGeral, min: 2100, unit: 'h' },
    { nome: 'Duplo comando', atual: totalDC, min: 1200, unit: 'h' },
    { nome: 'Duplo comando noturno', atual: dcNoturno, min: 180, unit: 'h' },
    { nome: 'Voo solo', atual: totalSolo, min: 600, unit: 'h' },
    { nome: 'Navegação solo', atual: navSolo, min: 300, unit: 'h' },
    { nome: 'FSTD (crédito, opcional)', atual: fstdCred, real: fstd, min: null, max: 300, unit: 'h', info: true },
    { nome: 'Navegação 150nm', atual: nav150.milhas, min: 150, unit: 'nm', nav: nav150 },
  ];

  return { tipo: 'PPA', label: 'Piloto Privado de Avião', minimos, totais: { totalGeral, totalDC, dcNoturno, totalSolo, navSolo } };
}

// ─── ANÁLISE PC/IFR ───────────────────────────────────────────
function analisarPC(rows) {
  const pic  = rows.filter(r => r.funcao === 'PIC');
  const pi   = rows.filter(r => r.funcao === 'PI');

  const picTotal   = sum(pic, r => r.diurno + r.noturno);
  const picNaveg   = sum(pic, r => r.naveg);
  const picNoturno = sum(pic, r => r.noturno);
  const totalGeral = sum(rows, r => r.diurno + r.noturno);

  // IFR: PI com inst em aeronave + simulador (máx 20h = 1200min)
  const ifrAeronave = sum(pi.filter(r => r.simulador === 0), r => r.inst);
  const fstd        = sum(rows, r => r.simulador);
  const fstdCred    = Math.min(fstd, 1200); // até 20h
  const totalIFR    = ifrAeronave + fstdCred;

  // Nav 300nm: trechos PIC no mesmo dia com obs semelhante, somam >= 300nm, 2 aeródromos além da partida
  const nav300 = verificarNav300(pic);

  const minimos = [
    { nome: 'Total PIC', atual: picTotal, min: 4200, unit: 'h' },
    { nome: 'Navegação como PIC', atual: picNaveg, min: 3000, unit: 'h' },
    { nome: 'Noturno como PIC', atual: picNoturno, min: 300, unit: 'h' },
    { nome: 'IFR duplo comando (total)', atual: totalIFR, min: 2400, unit: 'h' },
    { nome: 'IFR em aeronave (mín. 15h das 40h)', atual: ifrAeronave, min: 900, unit: 'h' },
    { nome: 'FSTD IFR (máx. 20h aproveitável)', atual: fstdCred, real: fstd, min: null, max: 1200, unit: 'h', info: true },
    { nome: 'Navegação 300nm', atual: nav300.milhas, min: 300, unit: 'nm', nav: nav300 },
  ];

  return { tipo: 'PC/IFR', label: 'Piloto Comercial + Voo por Instrumento', minimos, totais: { picTotal, picNaveg, picNoturno, totalIFR, ifrAeronave, fstdCred, totalGeral } };
}

// ─── VERIFICAR NAVEGAÇÃO ──────────────────────────────────────
function verificarNav(rows, minNm) {
  // Voos com milhas suficientes
  const candidatos = rows.filter(r => r.milhas >= minNm);
  if (!candidatos.length) return { ok: false, milhas: 0, aerodromos: 0, detalhe: 'Nenhum voo com milhas suficientes' };

  for (const r of candidatos) {
    const icaos = extrairICAOs(r.observacao);
    const aeroAlemPartida = icaos.filter(i => i !== r.origem);
    const aerosUnicos = [...new Set(aeroAlemPartida.filter(i => i !== r.destino || r.origem !== r.destino))];
    if (aerosUnicos.length >= 2) {
      return { ok: true, milhas: r.milhas, aerodromos: aerosUnicos.length, detalhe: `${r.data} · ${r.milhas}nm · Aeródromos: ${aerosUnicos.join(', ')}`, voo: r };
    }
    // Fallback: conta pousos (origem + volta = 2 intermediários se pousos >= 3... mas verificamos ICAOs primeiro)
    // Se obs tem só 1 ICAO intermediário mas pousos >= 3, pode ter 2 aeródromos
    if (r.pousos >= 3 && aeroAlemPartida.length >= 1) {
      return { ok: false, milhas: r.milhas, aerodromos: aeroAlemPartida.length, detalhe: `${r.data} · ${r.milhas}nm · Apenas ${aeroAlemPartida.length} aeródromo(s) além da partida detectado(s) (necessário: 2)`, voo: r };
    }
  }

  const melhor = candidatos.reduce((a,b) => a.milhas > b.milhas ? a : b);
  const icaos = extrairICAOs(melhor.observacao);
  const aeros = [...new Set(icaos.filter(i => i !== melhor.origem))];
  return { ok: false, milhas: melhor.milhas, aerodromos: aeros.length, detalhe: `${melhor.data} · ${melhor.milhas}nm · Apenas ${aeros.length} aeródromo(s) além da partida detectado(s) (necessário: 2)`, voo: melhor };
}

function verificarNav150(rows) {
  // Agrupa todos os registros por dia (qualquer função), soma milhas e coleta aeródromos
  const porDia = {};
  rows.forEach(r => {
    if (!r.milhas || r.milhas === 0) return;
    if (!porDia[r.data]) porDia[r.data] = [];
    porDia[r.data].push(r);
  });

  let melhorInfo = null;

  for (const [dia, voos] of Object.entries(porDia)) {
    const totalNm = voos.reduce((a, v) => a + v.milhas, 0);
    const todosIcaos = [];
    voos.forEach(v => {
      if (v.origem) todosIcaos.push(v.origem);
      if (v.destino) todosIcaos.push(v.destino);
      extrairICAOs(v.observacao).forEach(i => todosIcaos.push(i));
    });
    const partida = voos[0].origem;
    const aeroAlem = [...new Set(todosIcaos.filter(i => i && i !== partida && i.length === 4))];
    const esteOk = totalNm >= 150 && aeroAlem.length >= 2;
    const melhorOkAtual = melhorInfo && melhorInfo.totalNm >= 150 && melhorInfo.aeroAlem.length >= 2;
    if (!melhorInfo ||
        (esteOk && !melhorOkAtual) ||
        (esteOk && melhorOkAtual && totalNm > melhorInfo.totalNm) ||
        (!esteOk && !melhorOkAtual && totalNm > melhorInfo.totalNm)) {
      melhorInfo = { dia, totalNm, partida, aeroAlem, voos };
    }
  }

  if (!melhorInfo) return { ok: false, milhas: 0, aerodromos: 0, detalhe: 'Nenhum voo de navegação encontrado' };

  const ok = melhorInfo.totalNm >= 150 && melhorInfo.aeroAlem.length >= 2;
  return {
    ok,
    milhas: Math.round(melhorInfo.totalNm),
    aerodromos: melhorInfo.aeroAlem.length,
    detalhe: `${melhorInfo.dia} · ${melhorInfo.totalNm.toFixed(0)}nm · Aeródromos: ${melhorInfo.aeroAlem.join(', ') || 'não identificados'}`,
    voos: melhorInfo.voos
  };
}

function verificarNav300(rows) {
  // Agrupa trechos do mesmo dia com observação semelhante (mesma missão em múltiplos trechos)
  const porDia = {};
  rows.forEach(r => {
    const dKey = r.data;
    if (!porDia[dKey]) porDia[dKey] = [];
    porDia[dKey].push(r);
  });

  let melhorInfo = null;

  for (const [dia, voos] of Object.entries(porDia)) {
    const totalNm = voos.reduce((a, v) => a + v.milhas, 0);
    // Coletar todos os aeródromos visitados
    const todos_icaos = [];
    voos.forEach(v => {
      todos_icaos.push(v.origem);
      todos_icaos.push(v.destino);
      extrairICAOs(v.observacao).forEach(i => todos_icaos.push(i));
    });
    const partida = voos[0].origem;
    const aeroAlem = [...new Set(todos_icaos.filter(i => i && i !== partida && i.length === 4))];
    const esteOk = totalNm >= 300 && aeroAlem.length >= 2;
    const melhorOkAtual = melhorInfo && melhorInfo.totalNm >= 300 && melhorInfo.aeroAlem.length >= 2;
    if (!melhorInfo ||
        (esteOk && !melhorOkAtual) ||
        (esteOk && melhorOkAtual && totalNm > melhorInfo.totalNm) ||
        (!esteOk && !melhorOkAtual && totalNm > melhorInfo.totalNm)) {
      melhorInfo = { dia, totalNm, partida, aeroAlem, voos };
    }
  }

  if (!melhorInfo) return { ok: false, milhas: 0, aerodromos: 0, detalhe: 'Nenhum voo de navegação encontrado' };

  const ok = melhorInfo.totalNm >= 300 && melhorInfo.aeroAlem.length >= 2;
  return {
    ok,
    milhas: Math.round(melhorInfo.totalNm),
    aerodromos: melhorInfo.aeroAlem.length,
    detalhe: `${melhorInfo.dia} · ${melhorInfo.totalNm.toFixed(0)}nm · Aeródromos: ${melhorInfo.aeroAlem.join(', ') || 'não identificados'}`,
    voos: melhorInfo.voos
  };
}

function extrairICAOs(obs) {
  if (!obs) return [];
  return [...new Set((obs.match(/\b(S[BD][A-Z]{2}|SD[A-Z]{2})\b/g) || []))];
}

// ─── RENDER ───────────────────────────────────────────────────
function renderizarResultado(analise, ativos, todos) {
  const aprovado = analise.minimos
    .filter(m => m.min !== null)
    .every(m => m.nav ? m.nav.ok : m.atual >= m.min);

  const el = document.getElementById('resultado');
  el.style.display = 'block';

  // Totais para resumo
  const t = analise.totais;
  let resumoItems = '';
  if (analise.tipo === 'PPA') {
    resumoItems = `
      <div class="resumo-item"><span class="val">${fmt(t.totalGeral)}</span><span class="label">Total Horas</span></div>
      <div class="resumo-item"><span class="val">${fmt(t.totalDC)}</span><span class="label">Duplo Comando</span></div>
      <div class="resumo-item"><span class="val">${fmt(t.totalSolo)}</span><span class="label">Solo</span></div>
      <div class="resumo-item"><span class="val">${ativos.length}</span><span class="label">Registros</span></div>
    `;
  } else {
    resumoItems = `
      <div class="resumo-item"><span class="val">${fmt(t.totalGeral)}</span><span class="label">Total Horas</span></div>
      <div class="resumo-item"><span class="val">${fmt(t.picTotal)}</span><span class="label">Horas PIC</span></div>
      <div class="resumo-item"><span class="val">${fmt(t.totalIFR)}</span><span class="label">Horas IFR</span></div>
      <div class="resumo-item"><span class="val">${ativos.length}</span><span class="label">Registros</span></div>
    `;
  }

  // Cards de mínimos
  let cardsHtml = '';
  analise.minimos.forEach(m => {
    if (m.nav) {
      // Card especial navegação
      const ok = m.nav.ok;
      const cls = ok ? 'ok' : 'erro';
      const badge = ok ? '✅ OK' : '❌ DÉFICIT';
      cardsHtml += `
        <div class="minimo-card ${cls} full">
          <div class="mc-header">
            <span class="mc-nome">${escapeHtml(m.nome)}</span>
            <span class="mc-badge">${badge}</span>
          </div>
          <div class="mc-valores">
            <span class="mc-atual">${m.nav.milhas}nm</span>
            <span class="mc-minimo">/ mín. ${m.min}nm</span>
          </div>
          <div class="nav-detail">
            <span class="${ok ? 'nav-ok' : 'nav-erro'}">${escapeHtml(m.nav.detalhe)}</span><br>
            <span>Aeródromos além da partida: ${m.nav.aerodromos} ${m.nav.aerodromos >= 2 ? '✅' : '❌ (necessário: 2)'}</span>
          </div>
        </div>`;
      return;
    }

    if (m.info) {
      const fstdOk = m.real >= m.max;
      const cls = fstdOk ? 'ok' : 'aviso';
      const badge = fstdOk ? '✅ OK' : 'ℹ️ INFO';
      const pct = Math.min(100, (m.real / m.max) * 100);
      cardsHtml += `
        <div class="minimo-card ${cls}">
          <div class="mc-header">
            <span class="mc-nome">${escapeHtml(m.nome)}</span>
            <span class="mc-badge">${badge}</span>
          </div>
          <div class="mc-valores">
            <span class="mc-atual">${fmt(m.real)}</span>
            <span class="mc-minimo">registradas</span>
          </div>
          <div style="font-size:12px;font-family:'DM Mono',monospace;margin-top:4px;color:var(--texto-leve)">
            ${fmt(m.atual)} aproveitadas · máx. ${fmt(m.max)}
          </div>
          <div class="mc-barra-wrap"><div class="mc-barra" style="width:${pct}%"></div></div>
        </div>`;
      return;
    }

    const ok = m.atual >= m.min;
    const cls = ok ? 'ok' : 'erro';
    const badge = ok ? '✅ OK' : '❌ DÉFICIT';
    const pct = Math.min(100, (m.atual / m.min) * 100);
    const deficit = m.min - m.atual;
    cardsHtml += `
      <div class="minimo-card ${cls}">
        <div class="mc-header">
          <span class="mc-nome">${escapeHtml(m.nome)}</span>
          <span class="mc-badge">${badge}</span>
        </div>
        <div class="mc-valores">
          <span class="mc-atual">${fmt(m.atual)}</span>
          <span class="mc-minimo">/ mín. ${fmt(m.min)}</span>
        </div>
        ${!ok ? `<div class="mc-deficit">Faltam ${fmt(deficit)} (${fmtH(deficit)})</div>` : ''}
        <div class="mc-barra-wrap"><div class="mc-barra" style="width:${pct}%"></div></div>
      </div>`;
  });

  // Tabela de registros
  let linhasTabela = todos.map(r => {
    const excluido = r.status === 'EXCLUSÃO SOLICITADA' || r.status === 'EXCLUSAO SOLICITADA';
    const cls = excluido ? 'excluido' : '';
    const obs = String(r.observacao || '');
    const obsCurta = obs.substring(0, 50) + (obs.length > 50 ? '...' : '');
    return `<tr>
      <td class="${cls}">${escapeHtml(r.data)}</td>
      <td class="${cls}">${escapeHtml(r.funcao)}</td>
      <td class="${cls}">${fmt(r.diurno)}</td>
      <td class="${cls}">${fmt(r.noturno)}</td>
      <td class="${cls}">${fmt(r.naveg)}</td>
      <td class="${cls}">${fmt(r.inst)}</td>
      <td class="${cls}">${fmt(r.simulador)}</td>
      <td class="${cls}">${r.milhas > 0 ? r.milhas+'nm' : '-'}</td>
      <td class="${cls}">${r.pousos}</td>
      <td class="${cls}" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(obs)}">${escapeHtml(obsCurta)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="resultado-header">
      <h2>Resultado da Análise</h2>
      <span class="tipo-badge">${escapeHtml(analise.label)}</span>
    </div>
    <div class="resultado-body">
      <div class="resumo-geral">${resumoItems}</div>
      <div class="status-geral ${aprovado ? 'aprovado' : 'reprovado'}">
        <span class="status-icon">${aprovado ? '✅' : '❌'}</span>
        ${aprovado ? 'Aluno cumpre todos os mínimos ANAC para ' + escapeHtml(analise.label) : 'Aluno NÃO cumpre todos os mínimos ANAC para ' + escapeHtml(analise.label)}
      </div>
      <div class="minimos-grid">${cardsHtml}</div>
      <div class="registros-section">
        <div class="registros-toggle" id="toggle-tabela" onclick="toggleTabela()">
          <span class="toggle-icon">▼</span>
          Ver todos os registros (${todos.length} total · ${todos.length - ativos.length} excluídos)
        </div>
        <div class="registros-tabela-wrap" id="tabela-wrap">
          <table>
            <thead><tr>
              <th>Data</th><th>Função</th><th>Diurno</th><th>Noturno</th>
              <th>Naveg.</th><th>Inst.</th><th>Sim.</th><th>Milhas</th>
              <th>Pousos</th><th>Observação</th>
            </tr></thead>
            <tbody>${linhasTabela}</tbody>
          </table>
        </div>
      </div>
    </div>
    <button class="nova-analise-btn" onclick="novaAnalise()">↩ Nova Análise</button>
  `;
}

function toggleTabela() {
  const wrap = document.getElementById('tabela-wrap');
  const toggle = document.getElementById('toggle-tabela');
  wrap.classList.toggle('aberto');
  toggle.classList.toggle('aberto');
}

function novaAnalise() {
  document.getElementById('resultado').style.display = 'none';
  document.getElementById('resultado').innerHTML = '';
  document.getElementById('upload-section').style.display = 'block';
  document.getElementById('file-input').value = '';
}

const minionBanana = document.getElementById('minion-banana');
const bananaAudio = document.getElementById('banana-audio');
let ultimoBanana = 0;

function tocarBanana() {
  if (!bananaAudio) return;
  const agora = Date.now();
  if (agora - ultimoBanana < 900) return;
  ultimoBanana = agora;
  bananaAudio.currentTime = 0;
  bananaAudio.play().catch(() => {
    // Alguns navegadores só liberam áudio depois de um clique do usuário.
  });
}

minionBanana.addEventListener('mouseenter', tocarBanana);
minionBanana.addEventListener('click', tocarBanana);
minionBanana.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    tocarBanana();
  }
});
</script>
