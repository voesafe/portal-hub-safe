<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- tema:guarda-anti-flash -->
  <script>
    /* Carimba o modo escuro no <html> ANTES da primeira pintura.
       O Hub recarrega a pagina inteira a cada item da sidebar, entao sem
       isto quem usa escuro leva um clarao branco a cada navegacao.
       Precisa ser inline e sincrono no <head>: um arquivo externo chega
       tarde demais. Claro e o padrao e o sistema operacional nao opina,
       por decisao de produto, so entra no escuro quem pedir no menu. */
    (function () {
      try {
        var t = localStorage.getItem('safe-hub-theme');
        /* herda a preferencia de quem ja usava o escuro so dos NOTAMs */
        if (!t && localStorage.getItem('notams-theme') === 'dark') t = 'dark';
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <title>NOTAMs — SAFE Hub</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260706">
  <meta name="theme-color" content="#19213f">
  <link rel="icon" type="image/png" href="favicon.png?v=20260706">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260706">
  <link rel="stylesheet" href="css/core/safe-theme.css?v=20260728-zoom-mobile-v1">
  <link rel="stylesheet" href="css/core/layout.css?v=20260728-avatar-recorte-v1">
  <link rel="stylesheet" href="css/pages/notams.css?v=20260728-lupa-v1">
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="loading-card">
    <img src="assets/img/logo.png" alt="SAFE" style="width:40px;height:40px;border-radius:50%;animation:spin .9s linear infinite">
    <p>Carregando...</p>
  </div>
</div>

<div class="app-shell">

  <!-- ── Sidebar (regenerada por Auth.montarMenuSidebar) ──── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/img/logo.png" alt="SAFE">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">SAFE</span>
        <span class="sidebar-brand-sub">Hub</span>
      </div>
    </div>
    <div class="sidebar-toggle" id="sidebar-toggle" title="Recolher menu">‹</div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <a href="notams.html" class="nav-item active">
        <span class="nav-icon"></span><span class="nav-label">NOTAMs</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user-current">
        <div class="sidebar-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Carregando...</div>
          <div class="sidebar-user-role">—</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-context">
          <div class="topbar-title">NOTAMs</div>
          <div class="topbar-subtitle">Bases SAFE · SBSJ &amp; SDAM</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-status is-ok" id="notam-updated" title="Última atualização do cache">
          <span class="topbar-status-dot" aria-hidden="true"></span>
          <span id="notam-updated-text">—</span>
        </span>
        <button class="btn btn-ghost" id="notam-refresh" title="Consultar o DECEA agora e atualizar as bases">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          Atualizar
        </button>
      </div>
    </div>

    <div class="page notams-page">

      <!-- Aviso enquanto a API do DECEA não está conectada -->
      <div class="notam-note" id="notam-note" hidden></div>

      <!-- Resumo -->
      <section class="notam-tiles" id="notam-tiles"><!-- render via JS --></section>

      <!-- Controles: filtros de status + toggle cru/decodificado -->
      <section class="notam-controls">
        <div class="notam-filters" id="notam-filters">
          <button class="notam-chip active" data-filter="todos">Todos <span class="cnt" data-cnt="todos">0</span></button>
          <button class="notam-chip" data-filter="hoje">Ativos hoje <span class="cnt" data-cnt="hoje">0</span></button>
          <button class="notam-chip" data-filter="impacto">⚠ Com impacto <span class="cnt" data-cnt="impacto">0</span></button>
          <button class="notam-chip" data-filter="futuro">Futuros <span class="cnt" data-cnt="futuro">0</span></button>
        </div>
        <div class="notam-segmented" title="Alternar exibição de todos os NOTAMs">
          <button class="notam-seg active" data-view="decoded">Decodificado</button>
          <button class="notam-seg" data-view="raw">Cru</button>
        </div>
      </section>

      <!-- Abas por aeroporto + busca de outra localidade.
           As abas fixas são as bases SAFE; a consulta avulsa cria uma aba
           extra (com X para fechar) sem tocar nas duas. -->
      <div class="notam-tabsbar">
        <div class="notam-tabs" id="notam-tabs" role="tablist">
          <button class="notam-tab active" data-ap="todos" role="tab">Todos os aeroportos</button>
          <button class="notam-tab" data-ap="SBSJ" role="tab">SBSJ <span class="tcnt" data-tcnt="SBSJ">0</span></button>
          <button class="notam-tab" data-ap="SDAM" role="tab">SDAM <span class="tcnt" data-tcnt="SDAM">0</span></button>
        </div>
        <form class="notam-busca" id="notam-busca" role="search" novalidate>
          <label class="sr-only" for="notam-busca-input">Consultar outra localidade pelo código ICAO</label>
          <!-- Só aparece no celular. Enquanto ela estiver na tela, o campo fica
               em display:none, e elemento nesse estado NÃO PODE receber foco:
               é o que impede a página de abrir com o teclado no ar. -->
          <button type="button" class="notam-busca-lupa" id="notam-busca-lupa"
                  aria-label="Consultar outra localidade" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <input id="notam-busca-input" type="search" placeholder="Outra localidade (ex: SBGR)"
                 maxlength="4" autocomplete="off" spellcheck="false" aria-describedby="notam-busca-ajuda">
          <button type="submit" class="btn btn-ghost" id="notam-busca-btn">Consultar</button>
          <span class="sr-only" id="notam-busca-ajuda">Quatro letras do código ICAO. A consulta vai direto ao DECEA e não altera as bases SAFE.</span>
        </form>
      </div>

      <!-- Aeroportos (render via JS) -->
      <section class="notam-airports" id="notam-airports"><!-- render via JS --></section>

      <div class="notam-foot" id="notam-foot"></div>

    </div>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="js/core/config.js?v=20260728-notams-rbac-v1"></script>
<script src="js/core/api.js?v=20260728-notams-busca-v1"></script>
<script src="js/core/auth.js?v=20260728-notams-sync-v1"></script>
<script src="js/pages/notams.js?v=20260728-notams-sync-v1"></script>
</body>
</html>
