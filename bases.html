<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- tema:guarda-anti-flash -->
  <script>
    /* Carimba o modo escuro no <html> ANTES da primeira pintura.
       O Hub recarrega a pagina inteira a cada item da sidebar, entao sem
       isto quem usa escuro leva um clarao branco a cada navegacao.
       Precisa ser inline e sincrono no <head>: um arquivo externo chega
       tarde demais. Claro e o padrao e o sistema operacional nao opina,
       por decisao de produto, so entra no escuro quem pedir no menu. */
    (function () {
      try {
        var t = localStorage.getItem('safe-hub-theme');
        /* herda a preferencia de quem ja usava o escuro so dos NOTAMs */
        if (!t && localStorage.getItem('notams-theme') === 'dark') t = 'dark';
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <title>Bases — SAFE Hub</title>
  <link rel="manifest" href="manifest.webmanifest?v=d836cf66">
  <meta name="theme-color" content="#19213f">
  <link rel="icon" type="image/png" href="favicon.png?v=91131805">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=4b0b2d7e">
  <link rel="stylesheet" href="css/core/safe-theme.css?v=9e14b94c">
  <link rel="stylesheet" href="css/core/layout.css?v=9d06c4a7">
  <link rel="stylesheet" href="css/pages/bases.css?v=e7d3c4ee">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/img/logo.png?v=59c27084" alt="SAFE">
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">SAFE</span>
        <span class="sidebar-brand-sub">Hub</span>
      </div>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user-current">
        <div class="sidebar-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Carregando...</div>
          <div class="sidebar-user-role">—</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-context">
          <div class="topbar-title">Bases SAFE</div>
          <div class="topbar-subtitle">Endereços e contatos das unidades</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="btn-nova-base" hidden>+ Nova base</button>
      </div>
    </div>

    <div class="page">
      <div class="bases-intro">
        <span class="bases-intro-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"></path>
            <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path>
            <path d="M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"></path>
          </svg>
        </span>
        <div>
          <strong>Informações exibidas na página inicial</strong>
          <p>As alterações salvas aqui ficam disponíveis para todos os usuários do SAFE Hub.</p>
        </div>
      </div>
      <div class="bases-grid" id="bases-grid">
        <div class="bases-empty">Carregando bases...</div>
      </div>

      <div class="dashboard-loading-overlay active" id="bases-loading">
        <div class="dashboard-loading-card">
          <img class="dashboard-loading-logo" src="assets/img/logo.png?v=59c27084" alt="">
          <span class="dashboard-loading-text" id="bases-loading-text">Carregando bases...</span>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-base">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-base-titulo">Nova base</h3>
      <button class="modal-close" type="button" onclick="fecharModal('modal-base')" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="base-nome">Nome da base</label>
        <input class="form-control" id="base-nome" type="text" placeholder="Ex.: SAFE Campinas">
      </div>
      <div class="form-group">
        <label class="form-label" for="base-endereco">Endereço</label>
        <input class="form-control" id="base-endereco" type="text" placeholder="Rua, avenida ou rodovia e número">
      </div>
      <div class="form-group">
        <label class="form-label" for="base-complemento">Complemento</label>
        <input class="form-control" id="base-complemento" type="text" placeholder="Terminal, hangar, sala...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="base-cidade">Cidade</label>
          <input class="form-control" id="base-cidade" type="text">
        </div>
        <div class="form-group base-uf">
          <label class="form-label" for="base-uf">UF</label>
          <input class="form-control" id="base-uf" type="text" maxlength="2">
        </div>
        <div class="form-group">
          <label class="form-label" for="base-cep">CEP</label>
          <input class="form-control" id="base-cep" type="text" placeholder="00000-000">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="base-email">E-mail</label>
          <input class="form-control" id="base-email" type="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="base-telefone">Telefone</label>
          <input class="form-control" id="base-telefone" type="text">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="base-mapa">Link do Google Maps</label>
        <input class="form-control" id="base-mapa" type="url" placeholder="Opcional: o endereço será usado automaticamente">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="base-ordem">Ordem de exibição</label>
          <input class="form-control" id="base-ordem" type="number" min="0" value="0">
        </div>
        <label class="base-checkbox">
          <input id="base-ativa" type="checkbox" checked>
          <span>Exibir esta base na página inicial</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" type="button" onclick="fecharModal('modal-base')">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-base" type="button">Salvar base</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/core/config.js?v=e18544d3"></script>
<script src="js/core/api.js?v=bccb346f"></script>
<script src="js/core/auth.js?v=af6d1b4d"></script>
<script src="js/pages/bases.js?v=5e331d71"></script>
</body>
</html>
